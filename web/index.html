<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge UI</title>
<style>
/* ── Reset ────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --c-success:#1a9a6b;--c-success-bg:#e6f7f0;--c-success-dim:#15784f;
  --c-warning:#b8860b;--c-warning-bg:#fdf6e3;
  --c-danger:#c53030;--c-danger-bg:#fef2f2;
  --c-accent:#6d5cdb;--c-accent-bg:#f0eeff;--c-accent-hover:#5a4abf;
  --c-bg:#ffffff;--c-bg-rgb:255,255,255;--c-bg-secondary:#f7f8fa;
  --c-bg-card:#ffffff;--c-bg-elevated:#ffffff;--c-bg-inset:#f0f1f3;
  --c-text:#111827;--c-text-secondary:#6b7280;--c-text-dim:#9ca3af;--c-text-on-accent:#fff;
  --c-border:#e5e7eb;--c-border-hover:#d1d5db;--c-border-focus:var(--c-accent);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"SF Mono","Fira Code","Fira Mono",Menlo,Consolas,monospace;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;
  --r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:16px;--r-full:9999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);--shadow-md:0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:0 8px 24px rgba(0,0,0,.12);--shadow-xl:0 16px 48px rgba(0,0,0,.16);
  --ease:cubic-bezier(.33,1,.68,1);--ease-in:cubic-bezier(.32,0,.67,0);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
  --t-fast:120ms;--t-med:200ms;--t-slow:350ms;
  --sidebar-w:220px;--topbar-h:52px;--content-max-w:1200px;
}

@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --c-bg:#0d0f14;--c-bg-rgb:13,15,20;--c-bg-secondary:#151820;--c-bg-card:#1a1d28;
    --c-bg-elevated:#1e2130;--c-bg-inset:#12141b;
    --c-text:#e5e7eb;--c-text-secondary:#9ca3af;--c-text-dim:#6b7280;
    --c-border:#252838;--c-border-hover:#353a50;
    --c-success-bg:#0a2218;--c-warning-bg:#221a00;--c-danger-bg:#250a0a;--c-accent-bg:#1a1530;
    --shadow-sm:0 1px 2px rgba(0,0,0,.2);--shadow-md:0 2px 8px rgba(0,0,0,.3);
    --shadow-lg:0 8px 24px rgba(0,0,0,.4);--shadow-xl:0 16px 48px rgba(0,0,0,.5);
  }
}
[data-theme="dark"]{
  --c-bg:#0d0f14;--c-bg-rgb:13,15,20;--c-bg-secondary:#151820;--c-bg-card:#1a1d28;
  --c-bg-elevated:#1e2130;--c-bg-inset:#12141b;
  --c-text:#e5e7eb;--c-text-secondary:#9ca3af;--c-text-dim:#6b7280;
  --c-border:#252838;--c-border-hover:#353a50;
  --c-success-bg:#0a2218;--c-warning-bg:#221a00;--c-danger-bg:#250a0a;--c-accent-bg:#1a1530;
  --shadow-sm:0 1px 2px rgba(0,0,0,.2);--shadow-md:0 2px 8px rgba(0,0,0,.3);
  --shadow-lg:0 8px 24px rgba(0,0,0,.4);--shadow-xl:0 16px 48px rgba(0,0,0,.5);
}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

body{font-family:var(--font);background:var(--c-bg);color:var(--c-text);line-height:1.5;min-height:100vh;display:flex}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

/* ── Icons ────────────────────────────────────── */
.icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.icon svg{width:100%;height:100%}

/* ── Sidebar ──────────────────────────────────── */
.sidebar{width:var(--sidebar-w);height:100vh;position:fixed;top:0;left:0;display:flex;flex-direction:column;background:var(--c-bg-secondary);border-right:1px solid var(--c-border);z-index:50;overflow-y:auto;transition:transform var(--t-med) var(--ease)}
.sidebar-header{padding:var(--sp-5) var(--sp-4);border-bottom:1px solid var(--c-border);display:flex;align-items:center;gap:var(--sp-2)}
.sidebar-header .brand-icon{width:24px;height:24px;color:var(--c-accent)}
.sidebar-header .brand-text{font-size:16px;font-weight:700}
.sidebar-header .version-badge{font-size:10px;color:var(--c-text-dim);font-weight:400;margin-left:auto;padding:1px 6px;border-radius:var(--r-full);background:var(--c-bg-inset);border:1px solid var(--c-border)}

.nav-group{margin-top:var(--sp-3)}
.nav-group-label{display:block;padding:var(--sp-1) var(--sp-4);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--c-text-dim)}
.nav-item{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-4);margin:1px var(--sp-2);border-radius:var(--r-md);color:var(--c-text-secondary);text-decoration:none;font-size:13px;font-weight:500;cursor:pointer;position:relative;transition:all var(--t-fast) var(--ease);border:none;background:none;width:calc(100% - var(--sp-4));text-align:left}
.nav-item:hover{background:var(--c-bg-card);color:var(--c-text)}
.nav-item.active{background:var(--c-accent-bg);color:var(--c-accent)}
.nav-item.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:var(--c-accent)}
.nav-item .icon{width:18px;height:18px}
.nav-kbd{margin-left:auto;font-family:var(--font-mono);font-size:10px;padding:1px 5px;border-radius:var(--r-sm);background:var(--c-bg);border:1px solid var(--c-border);color:var(--c-text-dim);opacity:0;transition:opacity var(--t-fast)}
.sidebar:hover .nav-kbd,.sidebar:focus-within .nav-kbd{opacity:1}

.sidebar-footer{margin-top:auto;padding:var(--sp-3) var(--sp-2);border-top:1px solid var(--c-border);display:flex;flex-direction:column;gap:2px}
.sidebar-btn{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-md);color:var(--c-text-dim);background:none;border:none;font-size:12px;cursor:pointer;font-family:var(--font);width:100%;text-align:left}
.sidebar-btn:hover{color:var(--c-text);background:var(--c-bg-card)}
.sidebar-btn .icon{width:16px;height:16px}

/* ── Main Area ────────────────────────────────── */
.main-area{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:var(--topbar-h);position:sticky;top:0;z-index:40;background:rgba(var(--c-bg-rgb),.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;padding:0 var(--sp-6)}
.topbar-left{display:flex;align-items:center;gap:var(--sp-3)}
.topbar-title{font-size:15px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:var(--sp-3)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.status-connected{background:var(--c-success)}
.status-error{background:var(--c-danger)}
.topbar-status{display:flex;align-items:center;gap:var(--sp-2);font-size:12px;color:var(--c-text-dim)}
.sidebar-toggle{display:none;background:none;border:none;color:var(--c-text);cursor:pointer;padding:var(--sp-1)}
.sidebar-toggle .icon{width:20px;height:20px}

.content{flex:1;padding:var(--sp-6);max-width:var(--content-max-w);width:100%;margin:0 auto}

/* ── Views ────────────────────────────────────── */
.view{display:none}
.view.active{display:block;animation:viewIn var(--t-med) var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── Dashboard Hero ───────────────────────────── */
.dash-hero{display:flex;gap:var(--sp-6);align-items:flex-start;padding:var(--sp-6);background:var(--c-bg-card);border:1px solid var(--c-border);border-radius:var(--r-xl);margin-bottom:var(--sp-6)}
.dash-hero-ring{flex-shrink:0}
.dash-hero-info{flex:1;min-width:0}
.dash-hero-info h3{font-size:20px;font-weight:700;margin-bottom:var(--sp-1)}
.dash-hero-info p{font-size:13px;color:var(--c-text-secondary);margin-bottom:var(--sp-3)}
.dash-hero-actions{display:flex;gap:var(--sp-2);flex-shrink:0;align-self:flex-start}

.axes-badges{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-bottom:var(--sp-3)}

/* ── Score Ring ───────────────────────────────── */
.score-ring{position:relative;display:inline-flex}
.ring-track{fill:none;stroke:var(--c-border);stroke-width:8}
.ring-val{fill:none;stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 800ms var(--ease)}
.ring-a,.ring-b{stroke:var(--c-success)}.ring-c{stroke:var(--c-warning)}.ring-d,.ring-f{stroke:var(--c-danger)}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-score{font-size:2rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.ring-grade{font-size:.8rem;color:var(--c-text-secondary);font-weight:600}

/* ── Stat Grid ────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-6)}
.stat-card{background:var(--c-bg-card);border:1px solid var(--c-border);border-radius:var(--r-lg);padding:var(--sp-4);transition:border-color var(--t-fast)}
.stat-card:hover{border-color:var(--c-border-hover)}
.stat-val{font-size:1.5rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:11px;color:var(--c-text-secondary);text-transform:uppercase;letter-spacing:.05em;font-weight:500;margin-top:var(--sp-1)}

/* ── Section Card ─────────────────────────────── */
.section{background:var(--c-bg-card);border:1px solid var(--c-border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--sp-6)}
.section-hd{padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between}
.section-hd h3{font-size:14px;font-weight:600}
.section-bd{padding:var(--sp-5)}

/* ── Badges ───────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:var(--sp-1);padding:2px var(--sp-2);border-radius:var(--r-full);font-size:11px;font-weight:600;line-height:1.4}
.badge-success{background:var(--c-success-bg);color:var(--c-success)}
.badge-warning{background:var(--c-warning-bg);color:var(--c-warning)}
.badge-danger{background:var(--c-danger-bg);color:var(--c-danger)}
.badge-accent{background:var(--c-accent-bg);color:var(--c-accent)}
.badge-neutral{background:var(--c-bg-secondary);color:var(--c-text-secondary);border:1px solid var(--c-border)}

/* ── Buttons ──────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-md);font-size:13px;font-weight:500;font-family:var(--font);cursor:pointer;border:1px solid var(--c-border);background:var(--c-bg-card);color:var(--c-text);transition:all var(--t-fast) var(--ease);white-space:nowrap;line-height:1.4}
.btn:hover{border-color:var(--c-border-hover);background:var(--c-bg-secondary)}
.btn:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--c-accent);color:var(--c-text-on-accent);border-color:var(--c-accent)}
.btn-primary:hover{background:var(--c-accent-hover);border-color:var(--c-accent-hover)}
.btn-danger{color:var(--c-danger);border-color:var(--c-danger)}
.btn-danger:hover{background:var(--c-danger);color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--c-bg-secondary)}
.btn-sm{padding:var(--sp-1) var(--sp-3);font-size:11px}
.btn.loading{opacity:.7;pointer-events:none}
.btn-spinner{display:none;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
.btn.loading .btn-spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Forms ────────────────────────────────────── */
.form-group{margin-bottom:var(--sp-4)}
.form-label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--c-text-secondary);margin-bottom:var(--sp-1)}
.form-input{width:100%;padding:var(--sp-2) var(--sp-3);background:var(--c-bg-inset);border:1px solid var(--c-border);border-radius:var(--r-md);color:var(--c-text);font-family:var(--font);font-size:14px;transition:border-color var(--t-fast)}
.form-input:focus{border-color:var(--c-accent);outline:none;box-shadow:0 0 0 3px var(--c-accent-bg)}
.form-input::placeholder{color:var(--c-text-dim)}
.form-hint{font-size:11px;color:var(--c-text-dim);margin-top:var(--sp-1)}
select.form-input{cursor:pointer}

/* ── Data Table ───────────────────────────────── */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;padding:var(--sp-2) var(--sp-4);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--c-text-dim);border-bottom:1px solid var(--c-border);background:var(--c-bg-secondary)}
.data-table td{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--c-border);vertical-align:top}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--c-bg-secondary)}
.col-mono{font-family:var(--font-mono);font-size:12px}

/* ── Persona Cards ────────────────────────────── */
.persona-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--sp-4)}
.persona-card{background:var(--c-bg-card);border:1px solid var(--c-border);border-radius:var(--r-lg);padding:var(--sp-5);cursor:pointer;position:relative;transition:all var(--t-fast) var(--ease)}
.persona-card:hover{border-color:var(--c-border-hover);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.persona-card:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
.persona-card.current{border-color:var(--c-accent);background:var(--c-accent-bg)}
.persona-name{font-size:15px;font-weight:600;margin-bottom:var(--sp-1)}
.persona-desc{font-size:12px;color:var(--c-text-secondary);margin-bottom:var(--sp-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.persona-meta{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-3)}
.persona-actions{display:flex;gap:var(--sp-2);margin-top:var(--sp-3)}

/* ── Doctor Checks ────────────────────────────── */
.check-summary{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4);padding-bottom:var(--sp-4);border-bottom:1px solid var(--c-border)}
.check-list{display:flex;flex-direction:column;gap:1px}
.check-item{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);font-size:13px;transition:background var(--t-fast)}
.check-item:hover{background:var(--c-bg-secondary)}
.check-icon{flex-shrink:0;margin-top:1px;width:16px;height:16px}
.check-pass .check-icon{color:var(--c-success)}
.check-fail .check-icon{color:var(--c-danger)}
.check-warn .check-icon{color:var(--c-warning)}
.check-info .check-icon{color:var(--c-text-dim)}
.check-fail .check-msg{font-weight:500}

/* ── Diff Viewer ──────────────────────────────── */
.diff-viewer{font-family:var(--font-mono);font-size:12px;border:1px solid var(--c-border);border-radius:var(--r-lg);overflow:hidden}
.diff-header{padding:var(--sp-2) var(--sp-4);background:var(--c-bg-secondary);border-bottom:1px solid var(--c-border);font-weight:600;font-size:13px}
.diff-line{display:flex;padding:1px var(--sp-4);white-space:pre;line-height:1.6}
.diff-prefix{display:inline-block;width:16px;flex-shrink:0;color:var(--c-text-dim);user-select:none}
.diff-add{background:var(--c-success-bg);color:var(--c-success-dim)}
.diff-remove{background:var(--c-danger-bg);color:var(--c-danger)}
.status-output{font-family:var(--font-mono);font-size:12px;padding:var(--sp-4);background:var(--c-bg-inset);border-radius:var(--r-lg);line-height:1.7}
.status-line.status-header{font-weight:600;color:var(--c-text);margin-top:var(--sp-2)}

/* ── Security Log ─────────────────────────────── */
.log-entry{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--c-border);font-size:13px}
.log-entry:last-child{border-bottom:none}
.log-time{font-family:var(--font-mono);color:var(--c-text-dim);font-size:11px;flex-shrink:0;min-width:80px}
.log-cmd{font-family:var(--font-mono);font-size:12px;word-break:break-all}
.log-reason{font-size:12px;color:var(--c-text-secondary);margin-top:var(--sp-1)}
.filter-chips{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4);flex-wrap:wrap}
.chip{padding:var(--sp-1) var(--sp-3);border-radius:var(--r-full);font-size:12px;font-weight:500;background:var(--c-bg-secondary);color:var(--c-text-secondary);border:1px solid var(--c-border);cursor:pointer;transition:all var(--t-fast)}
.chip.active{background:var(--c-accent);color:#fff;border-color:var(--c-accent)}

/* ── Repo Cards ───────────────────────────────── */
.repo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--sp-4)}
.repo-card{background:var(--c-bg-card);border:1px solid var(--c-border);border-radius:var(--r-lg);padding:var(--sp-5);transition:all var(--t-fast)}
.repo-card:hover{border-color:var(--c-border-hover);box-shadow:var(--shadow-md)}
.repo-name{font-weight:600;font-size:14px;margin-bottom:var(--sp-1)}
.repo-path{font-family:var(--font-mono);font-size:11px;color:var(--c-text-dim);margin-bottom:var(--sp-3);word-break:break-all}
.repo-bar{height:6px;background:var(--c-border);border-radius:3px;overflow:hidden;margin-top:var(--sp-2)}
.repo-indicators{display:flex;gap:var(--sp-3);margin-bottom:var(--sp-2)}
.repo-dot{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:500;color:var(--c-text-dim);text-transform:uppercase;letter-spacing:.04em}
.repo-dot-pip{width:6px;height:6px;border-radius:50%;background:var(--c-border);flex-shrink:0}
.repo-dot-on .repo-dot-pip{background:var(--c-success)}
.repo-dot-on{color:var(--c-text-secondary)}
.repo-meta{font-size:11px;color:var(--c-text-dim);font-family:var(--font-mono);margin-bottom:var(--sp-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repo-dims{display:flex;gap:var(--sp-3);margin-top:var(--sp-2)}
.repo-dim{font-size:10px;color:var(--c-text-dim);text-transform:capitalize}
.repo-dim-val{font-weight:700;font-variant-numeric:tabular-nums;margin-right:2px}
.repo-bar-fill{height:100%;border-radius:3px;transition:width .4s var(--ease)}
.update-banner{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);background:var(--c-warning-bg);border:1px solid var(--c-warning);color:var(--c-warning);border-radius:var(--r-lg);font-size:13px;margin-bottom:var(--sp-5)}
.update-banner code{font-family:var(--font-mono);font-size:12px;padding:1px 6px;border-radius:var(--r-sm);background:rgba(0,0,0,.08)}
.rec-item{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--c-border);font-size:13px}
.rec-item:last-child{border-bottom:none}
.rec-msg{flex:1;min-width:0}
.rec-cmd{font-family:var(--font-mono);font-size:11px;padding:2px 8px;border-radius:var(--r-sm);background:var(--c-bg-inset);border:1px solid var(--c-border);white-space:nowrap;flex-shrink:0}
.repo-tips{margin-top:var(--sp-3);padding-top:var(--sp-2);border-top:1px solid var(--c-border)}
.repo-tip{font-size:11px;color:var(--c-warning);display:flex;align-items:flex-start;gap:4px;margin-bottom:2px;line-height:1.4}
.repo-fix-btn{font-size:10px;padding:1px 8px;flex-shrink:0}
.rec-btn{flex-shrink:0}
.repo-sort-btn.active{background:var(--c-accent);color:var(--c-text-on-accent);border-color:var(--c-accent)}

/* ── Settings Tabs ────────────────────────────── */
.tabs{display:flex;border-bottom:1px solid var(--c-border);margin-bottom:var(--sp-5)}
.tab{padding:var(--sp-2) var(--sp-4);font-size:13px;font-weight:500;color:var(--c-text-secondary);cursor:pointer;border-bottom:2px solid transparent;transition:all var(--t-fast);background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font)}
.tab:hover{color:var(--c-text)}
.tab.active{color:var(--c-accent);border-bottom-color:var(--c-accent)}
.tab-panel{display:none}.tab-panel.active{display:block}

/* ── Modal ────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--t-med) var(--ease)}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-panel{background:var(--c-bg-elevated);border:1px solid var(--c-border);border-radius:var(--r-xl);padding:var(--sp-6);max-width:520px;width:90%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-xl);transform:scale(.96) translateY(8px);transition:transform var(--t-med) var(--ease)}
.modal-overlay.open .modal-panel{transform:scale(1) translateY(0)}
.modal-title{font-size:16px;font-weight:600;margin-bottom:var(--sp-4)}
.modal-body{margin-bottom:var(--sp-6);color:var(--c-text-secondary);font-size:14px}
.modal-actions{display:flex;gap:var(--sp-3);justify-content:flex-end}

/* ── Slide-over ───────────────────────────────── */
.slideover-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:150;opacity:0;pointer-events:none;transition:opacity var(--t-med) var(--ease)}
.slideover-overlay.open{opacity:1;pointer-events:auto}
.slideover-panel{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:100%;background:var(--c-bg);border-left:1px solid var(--c-border);box-shadow:var(--shadow-xl);display:flex;flex-direction:column;transform:translateX(100%);transition:transform var(--t-slow) var(--ease);z-index:160}
.slideover-panel.open{transform:translateX(0)}
.slideover-hd{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--c-border)}
.slideover-hd h3{font-size:16px;font-weight:600}
.slideover-bd{flex:1;overflow-y:auto;padding:var(--sp-5)}
.slideover-ft{padding:var(--sp-4) var(--sp-5);border-top:1px solid var(--c-border);display:flex;gap:var(--sp-3);justify-content:flex-end}

/* ── Wizard Radio ─────────────────────────────── */
.radio-group{display:flex;flex-direction:column;gap:var(--sp-2)}
.radio-option{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border:1px solid var(--c-border);border-radius:var(--r-md);cursor:pointer;transition:all var(--t-fast)}
.radio-option:hover{border-color:var(--c-accent);background:var(--c-accent-bg)}
.radio-option.selected{border-color:var(--c-accent);background:var(--c-accent-bg)}
.radio-option input[type="radio"]{margin-top:3px;accent-color:var(--c-accent)}
.radio-option .radio-label{font-weight:500;font-size:14px}
.radio-option .radio-desc{font-size:12px;color:var(--c-text-secondary)}
.wizard-steps{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-5);flex-wrap:wrap}
.wizard-step{padding:var(--sp-1) var(--sp-3);border-radius:var(--r-full);font-size:11px;font-weight:600;background:var(--c-bg-secondary);color:var(--c-text-dim);border:1px solid var(--c-border)}
.wizard-step.active{background:var(--c-accent);color:#fff;border-color:var(--c-accent)}
.wizard-step.done{background:var(--c-success-bg);color:var(--c-success);border-color:var(--c-success)}

/* ── Toast ────────────────────────────────────── */
.toast-container{position:fixed;bottom:var(--sp-6);right:var(--sp-6);z-index:300;display:flex;flex-direction:column-reverse;gap:var(--sp-2);pointer-events:none}
.toast{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);background:var(--c-bg-elevated);border:1px solid var(--c-border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;pointer-events:auto;animation:toastIn var(--t-med) var(--ease);min-width:280px;max-width:420px}
.toast-success{border-left:3px solid var(--c-success)}.toast-error{border-left:3px solid var(--c-danger)}.toast-info{border-left:3px solid var(--c-accent)}
.toast .icon{flex-shrink:0;width:16px;height:16px}
.toast-success .icon{color:var(--c-success)}.toast-error .icon{color:var(--c-danger)}.toast-info .icon{color:var(--c-accent)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px) scale(.96)}}

/* ── Skeleton ─────────────────────────────────── */
.skeleton{background:linear-gradient(90deg,var(--c-bg-secondary) 25%,var(--c-bg-inset) 50%,var(--c-bg-secondary) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--r-md)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-text{height:14px;margin-bottom:var(--sp-2)}.skel-heading{height:24px;width:60%;margin-bottom:var(--sp-3)}.skel-ring{width:140px;height:140px;border-radius:50%}

/* ── Empty State ──────────────────────────────── */
.empty-state{text-align:center;padding:var(--sp-12);color:var(--c-text-secondary)}
.empty-state .icon{width:48px;height:48px;margin:0 auto var(--sp-4);color:var(--c-text-dim)}
.empty-state p{max-width:400px;margin:0 auto;font-size:14px}

/* ── Shortcuts Modal ──────────────────────────── */
.shortcut-row{display:flex;justify-content:space-between;align-items:center;padding:var(--sp-2) 0;font-size:13px}
.shortcut-key{font-family:var(--font-mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--r-sm);background:var(--c-bg-inset);border:1px solid var(--c-border);color:var(--c-text-secondary)}

/* ── Mobile ───────────────────────────────────── */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--c-bg);border-top:1px solid var(--c-border);z-index:100;align-items:stretch}
.mobile-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--c-text-dim);text-decoration:none;font-size:10px;font-weight:500;transition:color var(--t-fast);background:none;border:none;cursor:pointer;font-family:var(--font)}
.mobile-nav-item.active{color:var(--c-accent)}
.mobile-nav-item .icon{width:20px;height:20px}

@media(min-width:768px) and (max-width:1023px){
  .sidebar{width:56px;overflow:visible}
  .sidebar .brand-text,.sidebar .version-badge,.sidebar .nav-group-label,.sidebar .nav-item>span:not(.icon),.sidebar .nav-kbd,.sidebar-btn>span{opacity:0;width:0;overflow:hidden;white-space:nowrap;transition:opacity var(--t-fast)}
  .sidebar:hover{width:var(--sidebar-w);box-shadow:var(--shadow-xl)}
  .sidebar:hover .brand-text,.sidebar:hover .version-badge,.sidebar:hover .nav-group-label,.sidebar:hover .nav-item>span,.sidebar:hover .nav-kbd,.sidebar:hover .sidebar-btn>span{opacity:1;width:auto}
  .main-area{margin-left:56px}
}
@media(max-width:767px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.mobile-open{transform:translateX(0);z-index:200;box-shadow:var(--shadow-xl)}
  .main-area{margin-left:0;padding-bottom:64px}
  .mobile-nav{display:flex}
  .sidebar-toggle{display:flex}
  .content{padding:var(--sp-4)}
  .dash-hero{flex-direction:column;align-items:center;text-align:center}
  .dash-hero-actions{align-self:center}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .persona-grid{grid-template-columns:1fr}
  .slideover-panel{width:100%}
}
@media print{.sidebar,.mobile-nav,.toast-container,.topbar,.btn{display:none!important}.main-area{margin-left:0}}
</style>

var TOKEN='__FORGE_TOKEN__';

// ── API ──────────────────────────────────────────────────────
function api(method,path,body){
  var opts={method:method,headers:{}};
  if(method!=='GET'){opts.headers['X-Forge-Token']=TOKEN;opts.headers['Content-Type']='application/json';if(body)opts.body=JSON.stringify(body)}
  return fetch('/api/'+path,opts).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||'Unknown error');return j.data});
}
function cached(endpoint,force){
  var now=Date.now(),c=cache[endpoint];
  if(!force&&c&&(now-c.t)<STALE)return Promise.resolve(c.d);
  return api('GET',endpoint).then(function(d){cache[endpoint]={d:d,t:Date.now()};return d});
}

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

function formatBytes(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}
function flattenObj(obj,pfx){pfx=pfx||'';var r=[];for(var k in obj){if(!obj.hasOwnProperty(k))continue;var f=pfx?pfx+'.'+k:k;if(typeof obj[k]==='object'&&obj[k]!==null&&!Array.isArray(obj[k]))r=r.concat(flattenObj(obj[k],f));else r.push({key:f,value:obj[k]})}return r}

// ── Dimension labels & recommendations ──────────────────────
var DIM_LABELS={
  config_completeness:'Configuration',config:'Configuration',
  rule_coverage:'Rules',rules:'Rules',
  hook_coverage:'Hooks',doc_chain:'Documentation',
  freshness:'Freshness',plugin_alignment:'Plugins'
};
function dimLabel(k){return DIM_LABELS[k]||k.replace(/_/g,' ')}

function repoRecommendations(r){
  var tips=[],dc=r.doc_chain||{},cl=r.claude_md||{},p=r.path;
  if(!cl.exists)tips.push({pri:1,msg:'Initialize forge config',action:'init',path:p});
  if(!dc.project_md)tips.push({pri:2,msg:'Scaffold project documentation',action:'initDocs',path:p});
  if(!dc.requirements_md&&dc.project_md)tips.push({pri:3,msg:'Add requirements documentation',action:'initDocs',path:p});
  if(!dc.roadmap_md&&dc.project_md)tips.push({pri:3,msg:'Add delivery roadmap',action:'initDocs',path:p});
  if(r.rules&&r.rules.count<3)tips.push({pri:2,msg:'Install forge rules (have '+r.rules.count+', need 3+)',action:'install'});
  if(r.hooks&&!r.hooks.count)tips.push({pri:2,msg:'Install safety hooks',action:'install'});
  return tips.sort(function(a,b){return a.pri-b.pri});
}
function globalRecommendations(health,dash){
  var tips=[];
  if(health&&health.update_available)tips.push({pri:0,msg:'Update forge to v'+health.forge_version,action:'updateForge'});
  if(dash&&dash.global_score){
    var dims=dash.global_score.dimensions||{};
    if(dims.hook_coverage&&dims.hook_coverage.score<80)tips.push({pri:2,msg:'Install missing safety hooks',action:'install'});
    if(dims.freshness&&dims.freshness.score<60)tips.push({pri:1,msg:'Installation is stale \u2014 refresh to get latest',action:'updateForge'});
    if(dims.plugin_alignment&&dims.plugin_alignment.score<80)tips.push({pri:2,msg:'Plugin count doesn\u0027t match your group \u2014 reinstall to fix',action:'install'});
  }
  if(dash&&dash.repos){
    var noConfig=dash.repos.filter(function(r){return!r.claude_md||!r.claude_md.exists});
    noConfig.forEach(function(r){tips.push({pri:2,msg:'Initialize '+r.name,action:'init',path:r.path})});
  }
  return tips.sort(function(a,b){return a.pri-b.pri});
}
// Execute a recommendation action
function execRec(action,repoPath,btn){
  if(btn)setLoading(btn,true);
  var done=function(){if(btn)setLoading(btn,false);delete cache.dashboard;dashboardData=null;if(currentView==='dashboard')loadDashboard();if(currentView==='repos'){repoData=[];loadRepos()}};
  if(action==='updateForge'||action==='install'){
    api('POST','install',{}).then(function(){toast('Forge updated successfully','success');done()}).catch(function(e){toast('Failed: '+e.message,'error');done()});
  }else if(action==='init'){
    api('POST','init',{path:repoPath,skip_docs:true}).then(function(){toast('Initialized '+repoPath,'success');done()}).catch(function(e){toast('Init failed: '+e.message,'error');done()});
  }else if(action==='initDocs'){
    api('POST','init',{path:repoPath,docs:true}).then(function(){toast('Documentation scaffolded for '+repoPath,'success');done()}).catch(function(e){toast('Failed: '+e.message,'error');done()});
  }
}

// ── Score Ring ───────────────────────────────────────────────
function scoreRing(score,size){
  size=size||140;score=score||0;
  var r=size*.38,circ=2*Math.PI*r,off=circ*(1-score/100);
  var grade=score>=90?'A':score>=80?'B':score>=70?'C':score>=60?'D':'F';
  var cls=grade==='A'||grade==='B'?'ring-a':grade==='C'?'ring-c':'ring-f';
  return '<div class="score-ring" style="width:'+size+'px;height:'+size+'px">'+
    '<svg viewBox="0 0 '+size+' '+size+'" role="img" aria-label="Score: '+score+'">'+
    '<circle class="ring-track" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'"/>'+
    '<circle class="ring-val '+cls+'" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'" data-target="'+off+'"/>'+
    '</svg><div class="ring-label"><span class="ring-score">'+score+'</span><span class="ring-grade">'+grade+'</span></div></div>';
}
// Animate rings after render
function animateRings(){
  setTimeout(function(){document.querySelectorAll('.ring-val[data-target]').forEach(function(c){c.style.strokeDashoffset=c.dataset.target})},50);
}

function parseDoctorHTML(raw){
  var lines=raw.split('\n').filter(Boolean);
  var checks=[],pass=0,warn=0,fail=0,section='';
  lines.forEach(function(line){
    var l=line.trim();
    if(l.startsWith('==>'))section=l.replace(/^=+>\s*/,'');
    else if(l.startsWith('\u2713')){checks.push({s:'pass',m:l.slice(1).trim(),sec:section});pass++}
    else if(l.startsWith('!')||l.startsWith('\u26A0')){checks.push({s:'warn',m:l.replace(/^[!\u26A0]\s*/,''),sec:section});warn++}
    else if(l.startsWith('\u2717')||l.startsWith('\u2718')||l.startsWith('✗')){checks.push({s:'fail',m:l.replace(/^[\u2717\u2718✗]\s*/,''),sec:section});fail++}
    else if(l.match(/^\d+ checks/)||l.match(/Your system/))checks.push({s:'info',m:l,sec:''});
    else if(l.length>2&&!l.startsWith(' '))checks.push({s:'info',m:l,sec:section});
  });
  var h='<div class="section"><div class="section-hd"><h3>Doctor Results</h3></div><div class="section-bd">';
  h+='<div class="check-summary">';
  h+='<span class="badge badge-success">'+ic('check',12)+' '+pass+' passed</span>';
  if(warn)h+='<span class="badge badge-warning">'+ic('alertTri',12)+' '+warn+' warnings</span>';
  if(fail)h+='<span class="badge badge-danger">'+ic('x',12)+' '+fail+' failed</span>';
  h+='</div>';
  // Sort: fail first, then warn, then rest
  var sorted=checks.slice().sort(function(a,b){var o={fail:0,warn:1,info:2,pass:3};return(o[a.s]||4)-(o[b.s]||4)});
  h+='<div class="check-list">';
  sorted.forEach(function(c){
    var icn=c.s==='pass'?'check':c.s==='fail'?'x':c.s==='warn'?'alertTri':'info';
    h+='<div class="check-item check-'+c.s+'"><span class="check-icon">'+ic(icn,16)+'</span><span class="check-msg">'+esc(c.m)+'</span></div>';
  });
  h+='</div></div></div>';
  return h;
}

function parseDiffHTML(raw){
  var lines=raw.split('\n').filter(Boolean);
  var sections=[],cur=null;
  lines.forEach(function(l){
    var t=l.trim();
    if(t.startsWith('==>')){cur={label:t.replace(/^=+>\s*/,''),items:[]};sections.push(cur)}
    else if(cur){
      if(t.startsWith('\u2713'))cur.items.push({t:'ok',m:t.slice(1).trim()});
      else if(t.startsWith('+')||t.startsWith('\u002B '))cur.items.push({t:'add',m:t});
      else if(t.startsWith('-'))cur.items.push({t:'rm',m:t});
      else if(t.startsWith('~')||t.startsWith('!')||t.startsWith('\u26A0'))cur.items.push({t:'change',m:t.replace(/^[~!\u26A0]\s*/,'')});
      else if(t.length>1)cur.items.push({t:'ctx',m:t});
    }
  });
  if(!sections.length)return '<div class="status-output">'+esc(raw)+'</div>';
  var h='<div class="section"><div class="section-hd"><h3>Diff Results</h3></div><div class="section-bd">';
  sections.forEach(function(s){
    h+='<div style="margin-bottom:var(--sp-4)"><div style="font-weight:600;font-size:13px;margin-bottom:var(--sp-2)">'+esc(s.label)+'</div>';
    h+='<div class="check-list">';
    s.items.forEach(function(i){
      var icn=i.t==='ok'?'check':i.t==='add'?'plus':i.t==='rm'?'trash':i.t==='change'?'alertTri':'info';
      var cls=i.t==='ok'?'check-pass':i.t==='add'?'check-pass':i.t==='rm'?'check-fail':i.t==='change'?'check-warn':'check-info';
      h+='<div class="check-item '+cls+'"><span class="check-icon">'+ic(icn,16)+'</span><span class="check-msg">'+esc(i.m)+'</span></div>';
    });
    h+='</div></div>';
  });
  h+='</div></div>';
  return h;
}

function runScan(){
  var btn=$('btnScan'),sp=$('scanPath').value.trim(),sd=parseInt($('scanDepth').value)||3;
  if(!sp){toast('Enter a scan path','error');return}
  setLoading(btn,true);

    toast(d.repos?d.repos.length+' repos found':'Scan complete','success');
    repoData=d.repos||[];
    dashboardData=d; // Update global cache
    delete cache.dashboard;
    renderRepoResults();
    setLoading(btn,false);
  }).catch(function(e){toast('Scan failed: '+e.message,'error');setLoading(btn,false)});

function setRepoSort(s){
  repoSort=s;
  document.querySelectorAll('.repo-sort-btn').forEach(function(b){b.classList.toggle('active',b.dataset.sort===s)});
  renderRepoGrid();
}
function renderRepoResults(){
  if(!repoData.length){$('repoGrid').innerHTML='<div class="empty-state">'+ic('folderGit',48)+'<p>No repositories found</p></div>';return}
  $('repoToolbar').style.display='';
  // Summary stats
  var avg=0,high=0,low=0;
  repoData.forEach(function(r){var s=r.score?r.score.total:0;avg+=s;if(s>=80)high++;if(s<60)low++});
  avg=Math.round(avg/repoData.length);
  var sh='<div class="stat-grid" style="margin-bottom:var(--sp-5)">';
  sh+=statCard(repoData.length,'Repos Scanned');
  sh+=statCard(avg,'Avg Score');
  sh+=statCard(high,'High (80+)');
  sh+=statCard(low,'Needs Work (<60)');
  sh+='</div>';
  $('repoStats').innerHTML=sh;$('repoStats').style.display='';
  renderRepoGrid();
}
function renderRepoGrid(){
  var filtered=repoData;
  if(repoSearch){var q=repoSearch.toLowerCase();filtered=repoData.filter(function(r){return r.name.toLowerCase().indexOf(q)>=0||r.path.toLowerCase().indexOf(q)>=0})}
  var sorted=filtered.slice();
  if(repoSort==='score')sorted.sort(function(a,b){return(b.score?b.score.total:0)-(a.score?a.score.total:0)});
  else sorted.sort(function(a,b){return a.name.localeCompare(b.name)});
  var h='<div class="repo-grid">';
  if(!sorted.length)h+='<div class="empty-state"><p>No matching repos</p></div>';
  else sorted.forEach(function(r){h+=repoCard(r)});
  h+='</div>';
  $('repoGrid').innerHTML=h;
}

function renderSecurity(){
  // Build type counts from parsed data
  var typeCounts={};
  secData.forEach(function(e){var t=e.type||'unknown';typeCounts[t]=(typeCounts[t]||0)+1});
  var types=Object.keys(typeCounts).sort();
  var total=secData.length;
  // Stat cards for top event types
  var h='<div class="stat-grid" style="margin-bottom:var(--sp-5)">';
  h+=statCard(total,'Total Events');
  types.slice(0,3).forEach(function(t){h+=statCard(typeCounts[t],t.replace(/_/g,' '))});
  h+='</div>';
  // Filter chips
  h+='<div class="filter-chips"><button class="chip'+(secFilter==='all'?' active':'')+'" onclick="filterSec(\'all\')">All ('+total+')</button>';
  types.forEach(function(t){h+='<button class="chip'+(secFilter===t?' active':'')+'" onclick="filterSec(\''+esc(t)+'\')">'+esc(t.replace(/_/g,' '))+' ('+typeCounts[t]+')</button>'});
  h+='</div>';
  var filtered=secFilter==='all'?secData:secData.filter(function(e){return e.type===secFilter});
  h+='<div class="section"><div class="section-hd"><h3>'+ic('shield',16)+' Event Log</h3><span class="badge badge-neutral">'+filtered.length+' shown</span></div><div class="section-bd">';
  if(!filtered.length)h+='<div class="empty-state">'+ic('shieldCheck',48)+'<p>No security events'+(secFilter!=='all'?' matching filter':'')+'</p></div>';
  else filtered.slice(0,100).forEach(function(e){h+=renderLogEntry(e)});
  if(filtered.length>100)h+='<div style="padding:var(--sp-3);text-align:center;color:var(--c-text-dim);font-size:12px">Showing 100 of '+filtered.length+' events</div>';
  h+='</div></div>';
  $('view-security').innerHTML=h;
}
function secTypeBadge(type){
  if(!type)return '';
  var t=type.toUpperCase();
  var cls=t==='BLOCKED'||t==='SECRET_DETECTED'?'badge-danger':t==='ALLOWED'?'badge-success':'badge-warning';
  return '<span class="badge '+cls+'" style="flex-shrink:0">'+esc(type.replace(/_/g,' '))+'</span>';
}
function renderLogEntry(e){
  var h='<div class="log-entry">';
  if(e.timestamp){
    var d=e.timestamp.replace('T',' ').replace('Z','');
    h+='<span class="log-time">'+esc(d)+'</span>';
  }
  h+=secTypeBadge(e.type);
  h+='<div style="flex:1;min-width:0">';
  if(e.tool)h+='<span class="badge badge-neutral" style="margin-right:var(--sp-2)">'+ic('terminal',10)+' '+esc(e.tool)+'</span>';
  if(e.detail)h+='<div class="log-cmd">'+esc(e.detail)+'</div>';
  else if(e.command)h+='<div class="log-cmd">'+esc(e.command)+'</div>';
  else if(e.raw&&!e.type)h+='<div class="log-cmd">'+esc(e.raw)+'</div>';
  if(e.reason)h+='<div class="log-reason">'+esc(e.reason)+'</div>';
  h+='</div></div>';
  return h;
}
function filterSec(t){secFilter=t;renderSecurity()}

// ── Keyboard Navigation ──────────────────────────────────────
var kbState={lastKey:null,lastTime:0};
var focusIdx=-1;
document.addEventListener('keydown',function(e){
  var tag=e.target.tagName,inInput=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  if(e.key==='Escape'){
    if($('buildPanel').classList.contains('open')){closeBuild();e.preventDefault();return}
    if($('modalOverlay').classList.contains('open')){closeModal();e.preventDefault();return}
    if(inInput){e.target.blur();e.preventDefault();return}
    return;
  }
  if(inInput)return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  switch(e.key){
    case '1':case '2':case '3':case '4':case '5':case '6':navigate(viewNames[parseInt(e.key)-1]);e.preventDefault();break;
    case '/':var si=document.querySelector('.view.active .form-input');if(si){si.focus();e.preventDefault()}break;
    case '?':openShortcuts();e.preventDefault();break;
    case 't':toggleTheme();e.preventDefault();break;
    case 'j':navCards(1);e.preventDefault();break;
    case 'k':navCards(-1);e.preventDefault();break;
    case 'g':var now=Date.now();if(kbState.lastKey==='g'&&now-kbState.lastTime<500){window.scrollTo({top:0,behavior:'smooth'});e.preventDefault()}break;
    case 'Enter':var f=document.activeElement;if(f&&f.classList.contains('focusable-card')){f.click();e.preventDefault()}break;
  }
  kbState.lastKey=e.key;kbState.lastTime=Date.now();
});
function navCards(dir){
  var cards=document.querySelectorAll('.view.active .focusable-card');if(!cards.length)return;
  focusIdx=Math.max(0,Math.min(cards.length-1,focusIdx+dir));
  cards[focusIdx].focus();cards[focusIdx].scrollIntoView({behavior:'smooth',block:'nearest'});
  announce((focusIdx+1)+' of '+cards.length);
}
function openShortcuts(){
  var s=[['1-6','Navigate to view'],['/','Focus search'],['?','This help'],['t','Toggle theme'],['j / k','Navigate cards'],['Enter','Select card'],['Escape','Close / back'],['g g','Go to top']];
  var h='<div class="modal-title">Keyboard Shortcuts</div><div style="margin-bottom:var(--sp-6)">';
  s.forEach(function(r){h+='<div class="shortcut-row"><span>'+r[1]+'</span><kbd class="shortcut-key">'+r[0]+'</kbd></div>'});
  h+='</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>';
  openModal(h);
}
$('kbdBtn').onclick=openShortcuts;

// ── Connection check ─────────────────────────────────────────
function checkConnection(){
  fetch('/api/health').then(function(r){return r.json()}).then(function(j){
    $('connStatus').innerHTML='<span class="status-dot status-connected"></span><span>Connected</span>';
  }).catch(function(){
    $('connStatus').innerHTML='<span class="status-dot status-error"></span><span>Disconnected</span>';
  });
}
setInterval(checkConnection,15000);

// ── Init ─────────────────────────────────────────────────────
navigate(location.hash.slice(1)||'dashboard');
</script>
</body>
</html>
